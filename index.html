<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Roll Britannia Character Generator</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
    #loading{min-height:100vh;display:flex;align-items:center;justify-content:center;font-weight:800;background:#fff;color:#111}
  </style>
</head>
<body>
  <div id="loading">Loading Character Generator…</div>
  <script>
  (async()=>{
    const response=await fetch('./600_second_dnd_character_player_v22.html?v=20260806-2300',{cache:'no-store'});
    let app=await response.text();

    app=app.replace(/<img class="generator-logo"[^>]*>/,
      '<img class="generator-logo" src="./600 Second logo.png" alt="Roll Britannia 600 Second D&amp;D">');
    app=app.replace(/<h1>[^<]*<\/h1>/,'<h1>Character Generator</h1>');
    app=app.replace('if(!state || readyCount<3)return;','if(!state)return;');
    app=app.replace("els.fitBtn.addEventListener('click',()=>{document.getElementById('sheetStage').scrollTo({top:0,left:0,behavior:'smooth'});});",'');
    app=app.replace("if(!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(()=>{});",'');
    app=app.replace("if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});",'');
    app=app.replace('>EDIT CHARACTER</button>','>BACK TO EDIT</button>');

    const overrideCSS=`
<style id="github-pages-generator-overrides">
html,body{background:#fff!important;color:#111!important}
body:not(.play-mode){background:#fff!important;color:#111!important}
body:not(.play-mode) .app-shell{display:grid!important;grid-template-columns:minmax(320px,720px)!important;justify-content:center!important;min-height:100vh!important;background:#fff!important}
body:not(.play-mode) .controls{width:100%!important;padding:24px!important;overflow:visible!important;border-right:0!important;background:#fff!important;color:#111!important}
body:not(.play-mode) .preview-area{display:none!important}
body:not(.play-mode) .panel{background:#fff!important;border-color:#d7d7d7!important;color:#111!important;box-shadow:0 5px 18px rgba(0,0,0,.06)!important}
body:not(.play-mode) .generator-brand{background:#fff!important;border-color:#ddd!important}
body:not(.play-mode) .generator-logo{display:block!important;width:100%!important;max-width:620px!important;height:auto!important;margin:0 auto 12px!important;object-fit:contain!important}
body:not(.play-mode) .generator-brand h1{color:#000!important;text-align:center!important}
body:not(.play-mode) label{color:#333!important}
body:not(.play-mode) input,body:not(.play-mode) select,body:not(.play-mode) textarea{background:#fff!important;color:#111!important;border-color:#bbb!important}
body:not(.play-mode) input:focus,body:not(.play-mode) select:focus,body:not(.play-mode) textarea:focus{border-color:#666!important}
body:not(.play-mode) .point-buy-status,body:not(.play-mode) .character-summary{background:#f6f6f6!important;color:#111!important;border-color:#d0d0d0!important}
body:not(.play-mode) .secondary{background:#f1f1f1!important;color:#111!important;border-color:#c8c8c8!important}
body:not(.play-mode) .edit-collapse-toggle{color:#111!important}
body:not(.play-mode) .actions-panel{position:static!important;bottom:auto!important}
.download-character-panel .character-summary{display:block!important;width:100%!important;box-sizing:border-box!important;margin:0 0 14px!important;padding:14px 16px!important;text-align:center!important}
.character-summary .summary-name{display:block!important;width:100%!important;font-size:25px!important;line-height:1.12!important;font-weight:900!important;color:#111!important;margin:0 0 7px!important}
.character-summary .summary-details{display:block!important;width:100%!important;font-size:17px!important;line-height:1.3!important;font-weight:800!important;color:#333!important}
body.play-mode{margin:0!important;overflow:hidden!important;background:#111!important}
body.play-mode .app-shell{display:block!important;min-height:100vh!important;background:#111!important}
body.play-mode .controls{display:none!important}
body.play-mode .preview-area{display:flex!important;position:fixed!important;inset:0!important;z-index:999!important;width:100vw!important;height:100dvh!important;min-height:0!important;padding:0!important;background:#111!important;overflow:hidden!important;align-items:center!important;justify-content:center!important}
body.play-mode .sheet-stage{display:flex!important;width:100vw!important;height:100dvh!important;min-height:0!important;flex:1!important;padding:0!important;border:0!important;border-radius:0!important;overflow:hidden!important;background:#111!important;box-shadow:none!important;align-items:center!important;justify-content:center!important}
body.play-mode #sheetWrap{position:relative!important;width:min(100vw,calc(100dvh * .707))!important;max-width:none!important;flex:0 0 auto!important;z-index:1000!important}
body.play-mode #sheetCanvas{display:block!important;visibility:visible!important;opacity:1!important;width:100%!important;height:auto!important;background:#fff!important;box-shadow:none!important}
body.play-mode #hpPlayControls{display:block!important;position:absolute!important;inset:0!important;z-index:1002!important;pointer-events:none!important}
body.play-mode .hp-step{width:clamp(20px,3.2%,28px)!important;height:auto!important;aspect-ratio:1/1!important;padding:0!important;border:2px solid #D10300!important;border-radius:50%!important;background:#fff!important;color:#D10300!important;font-size:clamp(15px,1.9vw,20px)!important;line-height:1!important;box-shadow:0 2px 7px rgba(0,0,0,.22)!important;pointer-events:auto!important}
body.play-mode #hpMinusBtn{left:22.6%!important;top:28.75%!important;transform:translate(-50%,-50%)!important}
body.play-mode #hpPlusBtn{left:29.2%!important;top:28.75%!important;transform:translate(-50%,-50%)!important}
body.play-mode .exit-play{display:block!important;position:fixed!important;top:auto!important;bottom:12px!important;right:12px!important;z-index:1005!important;padding:8px 12px!important;border-radius:999px!important;background:rgba(20,20,20,.88)!important;color:#fff!important;font-size:11px!important;font-weight:800!important}
</style>`;

    app=app.replace('</head>',overrideCSS+'</head>');

    const summaryScript=`
<script id="summary-layout-fix">
(function(){
  function formatSummary(){
    const summary=document.getElementById('summary');
    if(!summary)return;
    let raw=summary.dataset.rawSummary||summary.textContent||'';
    raw=raw.trim();
    if(!raw)return;
    if(summary.querySelector('.summary-name'))return;
    const marker=' • Level ';
    const p=raw.indexOf(marker);
    if(p<0)return;
    summary.dataset.rawSummary=raw;
    const name=raw.slice(0,p).trim();
    let details='Level '+raw.slice(p+marker.length).trim();
    details=details.replace(/ • AC \\d+ • HP \\d+(?= • proficiency)/,'');
    summary.innerHTML='<span class="summary-name"></span><span class="summary-details"></span>';
    summary.querySelector('.summary-name').textContent=name;
    summary.querySelector('.summary-details').textContent=details;
  }
  const start=()=>{
    const summary=document.getElementById('summary');
    if(!summary)return;
    formatSummary();
    new MutationObserver(()=>{
      if(!summary.querySelector('.summary-name'))formatSummary();
    }).observe(summary,{childList:true,subtree:true,characterData:true});
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
<\/script>`;
    app=app.replace('</body>',summaryScript+'</body>');

    document.open();
    document.write(app);
    document.close();
  })().catch(err=>{
    document.getElementById('loading').textContent='Could not load the Character Generator. Please refresh.';
    console.error(err);
  });
  </script>
</body>
</html>
