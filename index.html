  if(!response.ok) throw new Error('Could not load app source: '+response.status);
  let app=await response.text();

  // Exact uploaded logo and current title.
  app=app.replace(/<img class="generator-logo"[^>]*>/,'<img class="generator-logo" src="./600 Second logo.png" alt="Roll Britannia 600 Second D&amp;D">');
  app=app.replace(/<h1>[^<]*<\/h1>/,'<h1>Character Generator</h1>');

  app=app.replace("els.fitBtn.addEventListener('click',()=>{document.getElementById('sheetStage').scrollTo({top:0,left:0,behavior:'smooth'});});",'');
  app=app.replace("if(!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(()=>{});",'');
  app=app.replace("if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});",'');
  app=app.replace('>EDIT CHARACTER</button>','>BACK TO EDIT</button>');

  // Magic Missile: three automatically hitting missiles, with the listed damage PER missile.
  app=app.replace("{name:'Magic Missile',ability:'CHA',dice:'3d4+3',type:'Force',desc:'Create three magical darts that automatically hit creatures you can see within 120 ft. The darts can strike one target or be divided among several.'}","{name:'Magic Missile',ability:'CHA',dice:'1d4+1',type:'Force / missile',auto:true,desc:'Create three magical darts that automatically hit creatures you can see within 120 ft. The listed damage is PER missile; all three can hit one target or be split among targets.'}");
  app=app.replace("{name:'Magic Missile',ability:'INT',dice:'3d4+3',type:'Force',desc:'Create three magical darts that automatically hit creatures you can see within 120 ft. The darts can strike one target or be divided among several.'}","{name:'Magic Missile',ability:'INT',dice:'1d4+1',type:'Force / missile',auto:true,desc:'Create three magical darts that automatically hit creatures you can see within 120 ft. The listed damage is PER missile; all three can hit one target or be split among targets.'}");

  app=app.replace("  function attackBonus(atk){\n    const ab=classData[state.cls]?.spell && atk.ability===classData[state.cls].spell ? classData[state.cls].spell : atk.ability;\n    return modifier(state.stats[ab]||10)+state.prof;\n  }","  function attackBonus(atk){\n    if(atk.auto) return 'Auto';\n    const ab=classData[state.cls]?.spell && atk.ability===classData[state.cls].spell ? classData[state.cls].spell : atk.ability;\n    return modifier(state.stats[ab]||10)+state.prof;\n  }");
  app=app.replace("  function attackDamage(atk){\n    if(atk.type==='Bonus') return atk.dice;\n    const mod=modifier(state.stats[atk.ability]||10);\n    const suffix = mod===0?'':(mod>0?`+${mod}`:`${mod}`);\n    return `${atk.dice}${suffix} ${atk.type}`;\n  }","  function attackDamage(atk){\n    if(atk.type==='Bonus') return atk.dice;\n    const spellAbility=classData[state.cls]?.spell;\n    const isSpellAttack=spellAbility && atk.ability===spellAbility;\n    if(isSpellAttack || atk.auto) return `${atk.dice} ${atk.type}`;\n    const mod=modifier(state.stats[atk.ability]||10);\n    const suffix = mod===0?'':(mod>0?`+${mod}`:`${mod}`);\n    return `${atk.dice}${suffix} ${atk.type}`;\n  }");
  app=app.replace("      if(m[2]==='bonus')return fmtMod(attackBonus(atk));","      if(m[2]==='bonus'){const b=attackBonus(atk);return typeof b==='number'?fmtMod(b):b;}");

  const css=`<style id="production-overrides">

body:not(.play-mode){background:#fff!important;color:#111!important;overflow-x:hidden!important;overflow-y:auto!important}

body:not(.play-mode) .panel{position:static!important;background:#fff!important;border-color:#d7d7d7!important;color:#111!important;box-shadow:0 5px 18px rgba(0,0,0,.06)!important}

.download-character-panel .character-summary{display:block!important;width:100%!important;box-sizing:border-box!important;margin:0 0 14px!important;padding:14px 16px!important;text-align:center!important;color:#111!important}
.character-summary .summary-name{display:block!important;width:100%!important;font-size:28px!important;line-height:1.08!important;font-weight:900!important;color:#111!important;margin:0 0 7px!important}
.character-summary .summary-details{display:block!important;width:100%!important;font-size:16px!important;line-height:1.3!important;font-weight:800!important;color:#333!important}
.download-character-panel #playBtn{width:100%!important}

body.play-mode .exit-play{display:block!important;position:fixed!important;top:auto!important;bottom:12px!important;right:12px!important;z-index:1005!important;padding:8px 12px!important;border-radius:999px!important;background:rgba(20,20,20,.88)!important;color:#fff!important;font-size:11px!important;font-weight:800!important}
</style>`;
  app=app.replace('</head>',css+'</head>');

  // Format the CURRENT summary every time it changes. Do not cache the first character.
  const summaryScript=`<script id="summary-layout-fix">
(function(){
  function formatSummary(){
    const summary=document.getElementById('summary');
    if(!summary || summary.querySelector('.summary-name'))return;
    const raw=(summary.textContent||'').trim();
    if(!raw)return;
    const marker=' • Level ';
    const p=raw.indexOf(marker);
    if(p<0)return;
    const name=raw.slice(0,p).trim();
    let details='Level '+raw.slice(p+marker.length).trim();
    details=details.replace(/ • AC \\d+ • HP \\d+(?= • proficiency)/,'');
    summary.innerHTML='';
    const nameEl=document.createElement('span');
    nameEl.className='summary-name';
    nameEl.textContent=name;
    const detailsEl=document.createElement('span');
    detailsEl.className='summary-details';
    detailsEl.textContent=details;
    summary.append(nameEl,detailsEl);
  }
  function start(){
    const summary=document.getElementById('summary');
    if(!summary)return;
    formatSummary();
    new MutationObserver(()=>formatSummary()).observe(summary,{childList:true,subtree:true,characterData:true});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
<\/script>`;
  app=app.replace('</body>',summaryScript+'</body>');

  document.open();
  document.write(app);
  document.close();
})().catch(err=>{
  console.error(err);
  document.getElementById('loading').textContent='Could not load the Character Generator. Please refresh.';
});
</script>
