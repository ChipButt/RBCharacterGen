<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Roll Britannia Character Generator</title>
  <style>
    html,body{margin:0;width:100%;min-height:100%;background:#fff;overflow:hidden}
    #app{display:block;width:100%;height:100dvh;border:0;background:#fff}
  </style>
</head>
<body>
  <iframe id="app" src="./600_second_dnd_character_player_v21.html?v=20260806-2205" title="Roll Britannia Character Generator" allow="fullscreen" allowfullscreen></iframe>
  <script>
    const frame=document.getElementById('app');

    function formatSummary(doc){
      const summary=doc.getElementById('summary');
      if(!summary) return;
      const raw=(summary.dataset.rawSummary || summary.textContent || '').trim();
      const marker=' • Level ';
      const split=raw.indexOf(marker);
      if(split<0) return;
      summary.dataset.rawSummary=raw;
      const name=raw.slice(0,split).trim();
      let details='Level '+raw.slice(split+marker.length).trim();
      details=details.replace(/ • AC \d+ • HP \d+(?= • proficiency)/,'');
      summary.innerHTML=`<span class="summary-name"></span><span class="summary-details"></span>`;
      summary.querySelector('.summary-name').textContent=name;
      summary.querySelector('.summary-details').textContent=details;
    }

    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc) return;

      const style=doc.createElement('style');
      style.textContent=`
        html,body{background:#fff!important;color:#111!important}
        body:not(.play-mode) .app-shell{display:grid!important;grid-template-columns:minmax(320px,720px)!important;justify-content:center!important;min-height:100vh!important;background:#fff!important}
        body:not(.play-mode) .controls{width:100%!important;padding:24px!important;border-right:0!important;background:#fff!important;color:#111!important}
        body:not(.play-mode) .preview-area{display:none!important}
        body:not(.play-mode) .panel{background:#fff!important;color:#111!important;border-color:#d8d8d8!important;box-shadow:0 5px 18px rgba(0,0,0,.06)!important}
        body:not(.play-mode) label{color:#333!important}
        body:not(.play-mode) input,body:not(.play-mode) select,body:not(.play-mode) textarea{background:#fff!important;color:#111!important;border-color:#bdbdbd!important}
        body:not(.play-mode) .point-buy-status,body:not(.play-mode) .character-summary{background:#f5f5f5!important;color:#111!important;border-color:#d0d0d0!important}
        body:not(.play-mode) .secondary{background:#f1f1f1!important;color:#111!important;border-color:#c8c8c8!important}
        .generator-brand h1{color:#000!important;text-align:center!important}
        .download-character-panel .character-summary{display:block!important;width:100%!important;margin:0 0 14px!important;padding:14px 16px!important;text-align:center!important}
        .character-summary .summary-name{display:block!important;width:100%!important;font-size:26px!important;line-height:1.15!important;font-weight:900!important;color:#111!important;margin-bottom:6px!important}
        .character-summary .summary-details{display:block!important;width:100%!important;font-size:17px!important;line-height:1.3!important;font-weight:800!important;color:#333!important}
      `;
      doc.head.appendChild(style);

      const title=doc.querySelector('.generator-brand h1');
      if(title){title.textContent='Character Generator';title.style.textAlign='center';title.style.color='#000'}

      formatSummary(doc);
      const summary=doc.getElementById('summary');
      if(summary){
        new MutationObserver(()=>{
          if(summary.querySelector('.summary-name')) return;
          delete summary.dataset.rawSummary;
          formatSummary(doc);
        }).observe(summary,{childList:true,subtree:true,characterData:true});
      }
    });
  </script>
</body>
</html>
