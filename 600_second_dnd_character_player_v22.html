<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>600 Second D&D — Character Generator</title>
  <style>:root{
  --bg:#171717;--panel:#222;--panel2:#2a2a2a;--text:#f6f6f6;--muted:#aaa;--line:#3b3b3b;--accent:#c81422;--accent2:#ef233c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit}
.app-shell{display:grid;grid-template-columns:390px minmax(0,1fr);min-height:100vh}
.controls{padding:24px;overflow:auto;border-right:1px solid #303030;background:linear-gradient(180deg,#191919,#202020)}
.brand-block{padding:4px 2px 18px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.16em;color:#ff6b76}.brand-block h1{font-size:30px;line-height:1.03;margin:6px 0 10px}.brand-block p{margin:0;color:#bdbdbd;line-height:1.45;font-size:14px}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 9px 26px rgba(0,0,0,.14)}
.panel h2{font-size:16px;margin:0 0 13px}.panel-heading{display:flex;align-items:center;justify-content:space-between}.panel-heading span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#9dd6a5;background:#203426;padding:4px 7px;border-radius:999px}
label{display:block;color:#d5d5d5;font-size:12px;font-weight:700;margin:0 0 11px}
input,select,textarea{display:block;width:100%;margin-top:5px;border:1px solid #444;background:#151515;color:#fff;border-radius:8px;padding:9px 10px;outline:none}
textarea{resize:vertical;line-height:1.35}input:focus,select:focus,textarea:focus{border-color:#777}
.grid{display:grid;gap:10px}.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}
button,.file-button{border:0;border-radius:9px;padding:10px 12px;cursor:pointer;font-weight:800;transition:.15s ease;text-align:center}
button:hover,.file-button:hover{transform:translateY(-1px)}
.primary{width:100%;background:linear-gradient(180deg,var(--accent2),var(--accent));color:white;box-shadow:0 5px 14px rgba(200,20,34,.22)}
.secondary,.file-button{background:#353535;color:#f4f4f4;border:1px solid #484848}.button-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.file-button{font-size:13px;display:flex;align-items:center;justify-content:center}.file-button input{display:none}.hint{font-size:11px;color:#929292;line-height:1.4;margin:9px 0 0}
.stats-editor{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:2px 0 11px}.stats-editor label{margin:0}.stats-editor input{text-align:center;padding:8px 4px}
.actions-panel{position:static;background:#242424}.download{font-size:14px}.summary{font-size:11px;line-height:1.45;color:#a9a9a9;margin-top:9px}
.preview-area{min-width:0;padding:18px 22px 30px;background:radial-gradient(circle at 50% 5%,#333 0,#202020 44%,#181818 100%);height:100vh;display:flex;flex-direction:column}
.preview-topline{display:flex;align-items:center;justify-content:space-between;padding:0 2px 12px;color:#ddd}.preview-topline strong{display:block;font-size:14px}.preview-topline span{font-size:11px;color:#888}.compact{padding:7px 10px;font-size:11px}
.sheet-stage{flex:1;min-height:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:10px 18px 30px;border:1px solid #343434;border-radius:16px;background:#121212;box-shadow:inset 0 0 60px rgba(0,0,0,.3)}
#sheetWrap{position:relative;width:min(100%,707px);flex:0 0 auto}
#sheetCanvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.55);transform-origin:top center}
#layoutOverlay{position:absolute;inset:0;pointer-events:none}
.layout-edit #layoutOverlay{pointer-events:auto}
.layout-box{position:absolute;display:none;border:2px dashed #ff6677;background:rgba(255,102,119,.10);box-sizing:border-box;cursor:move;touch-action:none}
.layout-edit .layout-box{display:block}
.layout-box.active{border-color:#62e8ff;background:rgba(98,232,255,.16);z-index:3}
.layout-box .box-label{position:absolute;left:0;top:-18px;background:rgba(0,0,0,.85);color:#fff;font-size:10px;line-height:1;padding:3px 5px;border-radius:4px;white-space:nowrap;pointer-events:none}
.resize-handle{position:absolute;width:13px;height:13px;right:-7px;bottom:-7px;border:2px solid #08282d;border-radius:50%;background:#62e8ff;cursor:nwse-resize}
.editor-disabled{opacity:.45;pointer-events:none}
.layout-status{white-space:pre-line;font-size:11px;line-height:1.45;color:#a8ddff;margin-top:9px}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.style-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.check-row{display:flex;gap:14px;align-items:center;margin:7px 0 11px}
.check-row label{display:flex;align-items:center;gap:6px;margin:0;font-size:12px}
.check-row input{width:auto;margin:0}
.inline-number{padding:7px 8px}
#selectedContent{min-height:70px}
.layout-help{font-size:11px;color:#999;line-height:1.4;margin:9px 0 0}
@media(max-width:980px){.app-shell{grid-template-columns:1fr}.controls{border-right:0}.preview-area{height:auto;min-height:100vh}.sheet-stage{min-height:800px}}

/* Character play mode */
#layoutOverlay{display:none!important}
#hpPlayControls{display:none;position:absolute;inset:0;pointer-events:none}
.hp-step{
  position:absolute;
  width:30px;height:30px;
  border-radius:50%;
  border:3px solid #D10300;
  background:#fff;
  color:#D10300;
  font-size:22px;
  line-height:1;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
  pointer-events:auto;
  touch-action:manipulation;
}
#hpMinusBtn{left:22.6%;top:28.8%;transform:translate(-50%,-50%)}
#hpPlusBtn{left:29.2%;top:28.8%;transform:translate(-50%,-50%)}
.exit-play{
  display:none;
  position:fixed;
  z-index:1001;
  top:12px;
  right:12px;
  border:0;
  border-radius:999px;
  padding:10px 15px;
  background:rgba(20,20,20,.88);
  color:#fff;
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
  box-shadow:0 4px 18px rgba(0,0,0,.28);
}
body.play-mode{overflow:hidden;background:#111}
body.play-mode .app-shell{display:block;min-height:100vh}
body.play-mode .controls{display:none!important}
body.play-mode .preview-area{
  position:fixed;
  inset:0;
  z-index:999;
  width:100vw;
  height:100vh;
  min-height:0;
  padding:0;
  background:#111;
  display:flex;
}
body.play-mode .preview-topline{display:none!important}
body.play-mode .sheet-stage{
  width:100vw;
  height:100vh;
  flex:1;
  padding:0;
  border:0;
  border-radius:0;
  overflow:hidden;
  background:#111;
  box-shadow:none;
  display:flex;
  align-items:center;
  justify-content:center;
}
body.play-mode #sheetWrap{
  position:relative;
  width:min(100vw,calc(100vh * 0.707));
  max-width:none;
  flex:0 0 auto;
}
body.play-mode #sheetCanvas{width:100%;height:auto;box-shadow:none}
body.play-mode #hpPlayControls{display:block}
body.play-mode .exit-play{display:block}
@media(max-width:700px){
  .hp-step{width:26px;height:26px;font-size:19px;border-width:2px}
  .exit-play{font-size:10px;padding:9px 12px}
}


.generator-brand{
  background:#ffffff;
  border:1px solid #dedede;
  border-radius:14px;
  padding:14px 12px 16px;
  margin-bottom:12px;
}
.generator-logo{
  display:block;
  width:100%;
  max-width:520px;
  height:auto;
  margin:0 auto 12px;
  object-fit:contain;
}
.generator-brand h1{
  margin:0;
  text-align:center;
  font-size:28px;
  line-height:1.1;
  font-weight:900;
  letter-spacing:.01em;
  color:#111111;
}


.point-buy-status{
  margin:-3px 0 12px;
  padding:8px 10px;
  border:1px solid #484848;
  border-radius:8px;
  background:#191919;
  color:#d8d8d8;
  font-size:11px;
  line-height:1.35;
  font-weight:700;
  text-align:center;
}
.point-buy-status.warning{
  border-color:#D10300;
  color:#ff8e8c;
}


.edit-panel{
  padding:0!important;
  overflow:hidden;
}
.edit-collapse-toggle{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 18px;
  border:0;
  background:transparent;
  color:inherit;
  cursor:pointer;
  text-align:left;
}
.edit-collapse-title{
  font-size:17px;
  font-weight:900;
}
.edit-collapse-meta{
  display:flex;
  align-items:center;
  gap:10px;
}
.edit-live{
  font-size:11px;
  font-weight:800;
  color:#9f9f9f;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.edit-chevron{
  font-size:24px;
  line-height:1;
  transition:transform .2s ease;
}
.edit-collapsible-content{
  max-height:1800px;
  opacity:1;
  overflow:hidden;
  padding:0 18px 18px;
  transition:max-height .25s ease, opacity .18s ease, padding .25s ease;
}
.edit-panel.collapsed .edit-collapsible-content{
  max-height:0;
  opacity:0;
  padding-top:0;
  padding-bottom:0;
}
.edit-panel:not(.collapsed) .edit-chevron{
  transform:rotate(180deg);
}


.download-character-panel .character-summary{
  display:block;
  width:100%;
  box-sizing:border-box;
  margin:0 0 12px;
  padding:12px 14px;
  border:1px solid #444;
  border-radius:9px;
  background:#191919;
  color:#f2f2f2;
  font-size:13px;
  line-height:1.4;
  font-weight:800;
  text-align:center;
  white-space:normal;
}
.download-character-panel #playBtn{
  width:100%;
}

</style>
</head>
