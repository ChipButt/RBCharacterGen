<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>600 Second D&D — Character Generator</title>
  <style>:root{
  --bg:#171717;--panel:#222;--panel2:#2a2a2a;--text:#f6f6f6;--muted:#aaa;--line:#3b3b3b;--accent:#c81422;--accent2:#ef233c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit}
.app-shell{display:grid;grid-template-columns:390px minmax(0,1fr);min-height:100vh}
.controls{padding:24px;overflow:auto;border-right:1px solid #303030;background:linear-gradient(180deg,#191919,#202020)}
.brand-block{padding:4px 2px 18px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.16em;color:#ff6b76}.brand-block h1{font-size:30px;line-height:1.03;margin:6px 0 10px}.brand-block p{margin:0;color:#bdbdbd;line-height:1.45;font-size:14px}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:0 9px 26px rgba(0,0,0,.14)}
.panel h2{font-size:16px;margin:0 0 13px}.panel-heading{display:flex;align-items:center;justify-content:space-between}.panel-heading span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#9dd6a5;background:#203426;padding:4px 7px;border-radius:999px}
label{display:block;color:#d5d5d5;font-size:12px;font-weight:700;margin:0 0 11px}
input,select,textarea{display:block;width:100%;margin-top:5px;border:1px solid #444;background:#151515;color:#fff;border-radius:8px;padding:9px 10px;outline:none}
textarea{resize:vertical;line-height:1.35}input:focus,select:focus,textarea:focus{border-color:#777}
.grid{display:grid;gap:10px}.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}
button,.file-button{border:0;border-radius:9px;padding:10px 12px;cursor:pointer;font-weight:800;transition:.15s ease;text-align:center}
button:hover,.file-button:hover{transform:translateY(-1px)}
.primary{width:100%;background:linear-gradient(180deg,var(--accent2),var(--accent));color:white;box-shadow:0 5px 14px rgba(200,20,34,.22)}
.secondary,.file-button{background:#353535;color:#f4f4f4;border:1px solid #484848}.button-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.file-button{font-size:13px;display:flex;align-items:center;justify-content:center}.file-button input{display:none}.hint{font-size:11px;color:#929292;line-height:1.4;margin:9px 0 0}
.stats-editor{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:2px 0 11px}.stats-editor label{margin:0}.stats-editor input{text-align:center;padding:8px 4px}
.actions-panel{position:sticky;bottom:8px;background:#242424}.download{font-size:14px}.summary{font-size:11px;line-height:1.45;color:#a9a9a9;margin-top:9px}
.preview-area{min-width:0;padding:18px 22px 30px;background:radial-gradient(circle at 50% 5%,#333 0,#202020 44%,#181818 100%);height:100vh;display:flex;flex-direction:column}
.preview-topline{display:flex;align-items:center;justify-content:space-between;padding:0 2px 12px;color:#ddd}.preview-topline strong{display:block;font-size:14px}.preview-topline span{font-size:11px;color:#888}.compact{padding:7px 10px;font-size:11px}
.sheet-stage{flex:1;min-height:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:10px 18px 30px;border:1px solid #343434;border-radius:16px;background:#121212;box-shadow:inset 0 0 60px rgba(0,0,0,.3)}
#sheetWrap{position:relative;width:min(100%,707px);flex:0 0 auto}
#sheetCanvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.55);transform-origin:top center}
#layoutOverlay{position:absolute;inset:0;pointer-events:none}
.layout-edit #layoutOverlay{pointer-events:auto}
.layout-box{position:absolute;display:none;border:2px dashed #ff6677;background:rgba(255,102,119,.10);box-sizing:border-box;cursor:move;touch-action:none}
.layout-edit .layout-box{display:block}
.layout-box.active{border-color:#62e8ff;background:rgba(98,232,255,.16);z-index:3}
.layout-box .box-label{position:absolute;left:0;top:-18px;background:rgba(0,0,0,.85);color:#fff;font-size:10px;line-height:1;padding:3px 5px;border-radius:4px;white-space:nowrap;pointer-events:none}
.resize-handle{position:absolute;width:13px;height:13px;right:-7px;bottom:-7px;border:2px solid #08282d;border-radius:50%;background:#62e8ff;cursor:nwse-resize}
.editor-disabled{opacity:.45;pointer-events:none}
.layout-status{white-space:pre-line;font-size:11px;line-height:1.45;color:#a8ddff;margin-top:9px}
.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.style-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.check-row{display:flex;gap:14px;align-items:center;margin:7px 0 11px}
.check-row label{display:flex;align-items:center;gap:6px;margin:0;font-size:12px}
.check-row input{width:auto;margin:0}
.inline-number{padding:7px 8px}
#selectedContent{min-height:70px}
.layout-help{font-size:11px;color:#999;line-height:1.4;margin:9px 0 0}
@media(max-width:980px){.app-shell{grid-template-columns:1fr}.controls{border-right:0}.preview-area{height:auto;min-height:100vh}.sheet-stage{min-height:800px}}

/* Character play mode */
#layoutOverlay{display:none!important}
#hpPlayControls{display:none;position:absolute;inset:0;pointer-events:none}
.hp-step{
  position:absolute;
  width:54px;height:54px;
  border-radius:50%;
  border:3px solid #D10300;
  background:#fff;
  color:#D10300;
  font-size:34px;
  line-height:1;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
  pointer-events:auto;
  touch-action:manipulation;
}
#hpMinusBtn{left:24.0%;top:28.8%;transform:translate(-50%,-50%)}
#hpPlusBtn{left:29.0%;top:28.8%;transform:translate(-50%,-50%)}
.exit-play{
  display:none;
  position:fixed;
  z-index:1001;
  top:12px;
  right:12px;
  border:0;
  border-radius:999px;
  padding:10px 15px;
  background:rgba(20,20,20,.88);
  color:#fff;
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
  box-shadow:0 4px 18px rgba(0,0,0,.28);
}
body.play-mode{overflow:hidden;background:#111}
body.play-mode .app-shell{display:block;min-height:100vh}
body.play-mode .controls{display:none!important}
body.play-mode .preview-area{
  position:fixed;
  inset:0;
  z-index:999;
  width:100vw;
  height:100vh;
  min-height:0;
  padding:0;
  background:#111;
  display:flex;
}
body.play-mode .preview-topline{display:none!important}
body.play-mode .sheet-stage{
  width:100vw;
  height:100vh;
  flex:1;
  padding:0;
  border:0;
  border-radius:0;
  overflow:hidden;
  background:#111;
  box-shadow:none;
  display:flex;
  align-items:center;
  justify-content:center;
}
body.play-mode #sheetWrap{
  position:relative;
  width:min(100vw,calc(100vh * 0.707));
  max-width:none;
  flex:0 0 auto;
}
body.play-mode #sheetCanvas{width:100%;height:auto;box-shadow:none}
body.play-mode #hpPlayControls{display:block}
body.play-mode .exit-play{display:block}
@media(max-width:700px){
  .hp-step{width:44px;height:44px;font-size:29px;border-width:2px}
  .exit-play{font-size:10px;padding:9px 12px}
}


.generator-brand{
  background:#ffffff;
  border:1px solid #dedede;
  border-radius:14px;
  padding:14px 12px 16px;
  margin-bottom:12px;
}
.generator-logo{
  display:block;
  width:100%;
  max-width:520px;
  height:auto;
  margin:0 auto 12px;
  object-fit:contain;
}
.generator-brand h1{
  margin:0;
  text-align:center;
  font-size:28px;
  line-height:1.1;
  font-weight:900;
  letter-spacing:.01em;
  color:#111111;
}


.point-buy-status{
  margin:-3px 0 12px;
  padding:8px 10px;
  border:1px solid #484848;
  border-radius:8px;
  background:#191919;
  color:#d8d8d8;
  font-size:11px;
  line-height:1.35;
  font-weight:700;
  text-align:center;
}
.point-buy-status.warning{
  border-color:#D10300;
  color:#ff8e8c;
}


.edit-panel{
  padding:0!important;
  overflow:hidden;
}
.edit-collapse-toggle{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px 18px;
  border:0;
  background:transparent;
  color:inherit;
  cursor:pointer;
  text-align:left;
}
.edit-collapse-title{
  font-size:17px;
  font-weight:900;
}
.edit-collapse-meta{
  display:flex;
  align-items:center;
  gap:10px;
}
.edit-live{
  font-size:11px;
  font-weight:800;
  color:#9f9f9f;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.edit-chevron{
  font-size:24px;
  line-height:1;
  transition:transform .2s ease;
}
.edit-collapsible-content{
  max-height:1800px;
  opacity:1;
  overflow:hidden;
  padding:0 18px 18px;
  transition:max-height .25s ease, opacity .18s ease, padding .25s ease;
}
.edit-panel.collapsed .edit-collapsible-content{
  max-height:0;
  opacity:0;
  padding-top:0;
  padding-bottom:0;
}
.edit-panel:not(.collapsed) .edit-chevron{
  transform:rotate(180deg);
}


.download-character-panel .character-summary{
  display:block;
  width:100%;
  box-sizing:border-box;
  margin:0 0 12px;
  padding:12px 14px;
  border:1px solid #444;
  border-radius:9px;
  background:#191919;
  color:#f2f2f2;
  font-size:13px;
  line-height:1.4;
  font-weight:800;
  text-align:center;
  white-space:normal;
}
.download-character-panel #playBtn{
  width:100%;
}

</style>
</head>

  function canonicalSpeciesName(raw){
    const input=String(raw||'').trim().toLowerCase();
    return Object.keys(speciesData).find(name=>name.toLowerCase()===input) || null;
  }

  function preloadSpeciesPortraits(){
    const entries=Object.entries(speciesPortraitFiles);
    return Promise.all(entries.map(([species,src])=>new Promise(resolve=>{
      const img=new Image();
      img.onload=()=>{ speciesPortraits[species]=img; resolve(); };
      img.onerror=()=>{ console.warn('Could not load species portrait:', species, src); resolve(); };
      img.src=src;
    })));
  }

  function applySpeciesPortrait(species){
    const canonical=canonicalSpeciesName(species);
    if(!canonical) return;
    const img=speciesPortraits[canonical];
    if(!img) return;
    portraitImg=img;
  }

  function makeStats(primary){
    const vals=[15,14,13,12,10,8];
    const out={};
    const prim=[...new Set(primary)];
    const remainingAbilities=shuffle(abilityOrder.filter(a=>!prim.includes(a)));
    const order=[...prim,...remainingAbilities];
    order.forEach((a,i)=>out[a]=vals[i]);
    return out;
  }


  const POINT_BUY_COSTS={8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
  const POINT_BUY_BUDGET=27;

  function pointBuyCost(score){
    return POINT_BUY_COSTS[Number(score)] ?? Infinity;
  }

  function totalPointBuyCost(stats){
    return abilityOrder.reduce((sum,a)=>sum+pointBuyCost(stats[a]),0);
  }

  function updatePointBuyStatus(message=''){
    if(!els.pointBuyStatus || !state)return;
    const spent=totalPointBuyCost(state.stats);
    const remaining=Math.max(0,POINT_BUY_BUDGET-spent);
    els.pointBuyStatus.classList.toggle('warning',Boolean(message));
    els.pointBuyStatus.textContent=message || `Point Buy: ${spent} / ${POINT_BUY_BUDGET} points used • ${remaining} remaining • scores 8–15`;
  }

  function refreshDerivedStatsAfterPointBuy(){
    if(!state || !classData[state.cls])return;
    state.ac=calcAC(state.cls,state.stats);
    state.hp=calcHP(state.cls,state.level,state.stats);
    if(!playMode)state.currentHp=state.hp;
    els.acInput.value=state.ac;
    els.hpInput.value=state.hp;
  }

  function makeName(species){
    const d=speciesData[species]; return `${rand(d.first)} ${rand(d.last)}`;
  }

  function proficiency(level){ return level>=5 ? 3 : 2; }

  function calcAC(cls, stats){
    const dex=modifier(stats.DEX), con=modifier(stats.CON), wis=modifier(stats.WIS);
    switch(classData[cls].ac){
      case 'heavy': return 18;
      case 'cleric': return 18;
      case 'medium': return 14 + Math.min(2,dex);
      case 'light': return 11 + dex;
      case 'caster': return 10 + dex;
      case 'wizard': return 13 + dex;
      case 'druid': return 11 + dex;
      case 'barbarian': return 10 + dex + con;
      case 'monk': return 10 + dex + wis;
      default:return 10+dex;
    }
  }

  function calcHP(cls, level, stats){
    const die=classData[cls].hit, con=modifier(stats.CON);
    let hp=die+con;
    for(let l=2;l<=level;l++) hp += Math.max(1,Math.floor(die/2)+1+con);
    return Math.max(level,hp);
  }

  function chooseSkills(cls){
    const d=classData[cls]; return shuffle(d.skillPool).slice(0,d.skillCount);
  }

  function chooseSpellLines(cls, level){
    const d=classData[cls];
    if(d.spells){
      const count=level>=3?6:5;
      return shuffle(d.spells).slice(0,Math.min(count,d.spells.length));
    }
    return d.notes || ['Weapon attacks','Class features'];
  }

  let lastEquipmentNames=[];

  function equipmentTagsForClass(cls){
    const tags=['universal'];
    if(['Barbarian','Fighter','Paladin','Monk'].includes(cls))tags.push('martial');
    if(['Wizard','Sorcerer','Warlock'].includes(cls))tags.push('arcane');
    if(['Druid','Ranger'].includes(cls))tags.push('wild');
    if(['Rogue'].includes(cls))tags.push('sneaky');
    if(['Cleric','Paladin'].includes(cls))tags.push('holy');
    if(['Bard'].includes(cls))tags.push('bardic','sneaky');
    return [...new Set(tags)];
  }

  function buildEquipmentCatalogue(cls){
    const allowed=equipmentTagsForClass(cls);
    const bases=EQUIPMENT_BASES.filter(item=>item.tags.some(tag=>allowed.includes(tag)));
    const catalogue=[];
    bases.forEach(base=>{
      EQUIPMENT_FLAVOURS.forEach(flavour=>{
        catalogue.push({
          name:`${flavour.prefix} ${base.name}`,
          desc:`${base.kind}. ${base.use} ${flavour.extra}`
        });
      });
    });
    return catalogue;
  }

  function generateQuirkyEquipment(cls){
    let catalogue=buildEquipmentCatalogue(cls);

    // Avoid immediately reusing any of the three items from the previous
    // generated character wherever the catalogue gives us enough alternatives.
    const fresh=catalogue.filter(item=>!lastEquipmentNames.includes(item.name));
    if(fresh.length>=3)catalogue=fresh;

    const chosen=[];
    const bag=[...catalogue];
    while(chosen.length<3 && bag.length){
      const idx=Math.floor(Math.random()*bag.length);
      const candidate=bag.splice(idx,1)[0];
      if(!chosen.some(item=>item.name===candidate.name))chosen.push(candidate);
    }

    lastEquipmentNames=chosen.map(item=>item.name);
    const lines=chosen.map(item=>`${item.name} — ${item.desc}`);
    const gold=10+Math.floor(Math.random()*41);
    lines.push(`${gold} gp`);
    return lines;
  }

  function generateCharacter(){
    const species=els.speciesConstraint.value && els.speciesConstraint.value!=='random' ? els.speciesConstraint.value : rand(Object.keys(speciesData));
    const cls=els.classConstraint.value && els.classConstraint.value!=='random' ? els.classConstraint.value : rand(Object.keys(classData));
    const level=els.levelConstraint.value && els.levelConstraint.value!=='random' ? Number(els.levelConstraint.value) : 1+Math.floor(Math.random()*5);
    const stats=makeStats(classData[cls].primary);
    const prof=proficiency(level);
    const skills=chooseSkills(cls);
    const spellLines=chooseSpellLines(cls,level);
    const rolledHp=calcHP(cls,level,stats);
    state={
      name:makeName(species), species, cls, level, stats,
      ac:calcAC(cls,stats), hp:rolledHp, currentHp:rolledHp, speed:`${speciesData[species].speed} ft`, prof,
      saveProfs:[...classData[cls].saves], skillProfs:skills,
      actions:makeActionRows(cls),
      spellLines,
      equipment:generateQuirkyEquipment(cls)
    };
    syncInputs(); applySpeciesPortrait(state.species); render();
  }

  function syncInputs(){
    if(!state)return;
    els.nameInput.value=state.name; els.speciesInput.value=state.species; els.classInput.value=state.cls;
    els.levelInput.value=state.level; els.acInput.value=state.ac; els.hpInput.value=state.hp; els.speedInput.value=state.speed;
    els.statsEditor.innerHTML='';
    abilityOrder.forEach(a=>{
      const l=document.createElement('label'); l.textContent=a;
      const input=document.createElement('input');
      input.type='number';
      input.min=8;
      input.max=15;
      input.step=1;
      input.value=state.stats[a];
      input.dataset.ability=a;

      input.addEventListener('change',()=>{
        const previous=state.stats[a];
        const requested=Number(input.value);

        if(!Number.isInteger(requested) || requested<8 || requested>15){
          input.value=previous;
          updatePointBuyStatus('Ability scores must stay between 8 and 15.');
          return;
        }

        const trial={...state.stats,[a]:requested};
        if(totalPointBuyCost(trial)>POINT_BUY_BUDGET){
          input.value=previous;
          updatePointBuyStatus('That change would exceed the 27-point budget. Lower another ability first.');
          return;
        }

        state.stats[a]=requested;
        refreshDerivedStatsAfterPointBuy();
        updatePointBuyStatus();
        render();
      });

      l.appendChild(input);
      els.statsEditor.appendChild(l);
    });
    updatePointBuyStatus();
    els.spellsInput.value=(state.actions||[]).map(a=>`${a.name}: ${a.desc}`).join('\n');
    els.equipmentInput.value=state.equipment.join('\n');
    els.summary.textContent=`${state.name} • Level ${state.level} ${state.species} ${state.cls} • proficiency ${fmtMod(state.prof)}`;
  }

  function bindEdits(){
    const map=[['nameInput','name'],['speciesInput','species'],['classInput','cls'],['levelInput','level'],['speedInput','speed']];
    map.forEach(([id,key])=>els[id].addEventListener('input',()=>{
      if(!state)return;
      state[key]=['level','ac','hp'].includes(key)?Number(els[id].value):els[id].value;
      if(key==='level'){ state.prof=proficiency(state.level); refreshDerivedStatsAfterPointBuy(); }
      if(key==='hp' && !playMode) state.currentHp=state.hp;
      if(key==='species'){
        const canonical=canonicalSpeciesName(state.species);
        if(canonical){
          state.species=canonical;
          state.speed=`${speciesData[canonical].speed} ft`;
          applySpeciesPortrait(canonical);
        }
      }
      render();
    }));
    els.spellsInput.addEventListener('input',()=>{
      const lines=els.spellsInput.value.split('\n').map(s=>s.trim()).filter(Boolean);
      if(!state.actions) state.actions=[];
      while(state.actions.length<4){state.actions.push({name:'Action',ability:'STR',dice:'1d6',type:'Effect',desc:'Describe this action.'});}
      lines.slice(0,4).forEach((line,i)=>{
        const parts=line.split(':');
        if(parts.length>1){
          state.actions[i].name=parts.shift().trim()||state.actions[i].name;
          state.actions[i].desc=parts.join(':').trim()||state.actions[i].desc;
        }else if(line){
          state.actions[i].desc=line;
        }
      });
      render();
    });
    els.equipmentInput.addEventListener('input',()=>{state.equipment=els.equipmentInput.value.split('\n').map(s=>s.trim()).filter(Boolean);render();});
  }
  bindEdits();

  function drawCoverImage(img,x,y,w,h){
    const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
    const s=Math.max(w/iw,h/ih); const dw=iw*s, dh=ih*s;
    ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
  }

  function fitFont(text,maxWidth,start,min,fontFamily='Arial',weight='700'){
    let size=start;
    while(size>min){ctx.font=`${weight} ${size}px ${fontFamily}`; if(ctx.measureText(text).width<=maxWidth) break; size-=1;}
    return size;
  }
  function text(x,y,str,size=30,weight='400',align='left',family='Arial',color='#111'){
    ctx.save(); ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.font=`${weight} ${size}px ${family}`; ctx.fillText(String(str),x,y); ctx.restore();
  }
  function fitText(x,y,str,maxWidth,start=32,min=17,weight='400',align='left',family='Arial',color='#111'){
    const sz=fitFont(String(str),maxWidth,start,min,family,weight); text(x,y,str,sz,weight,align,family,color); return sz;
  }
  function wrapText(x,y,str,maxWidth,lineHeight,maxLines,size=28,weight='400'){
    ctx.save();ctx.fillStyle='#111';ctx.font=`${weight} ${size}px Arial`;ctx.textAlign='left';ctx.textBaseline='top';
    const words=String(str).split(/\s+/); let lines=[],line='';
    for(const word of words){const test=line?`${line} ${word}`:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word;}else line=test;}
    if(line)lines.push(line); lines=lines.slice(0,maxLines);
    lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lineHeight));ctx.restore();
  }
  function centeredWrapped(x,y,str,maxWidth,lineHeight,maxLines,size=16,weight='400',color='#111') {
    ctx.save(); ctx.fillStyle=color; ctx.font=`${weight} ${size}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle';
    const words=String(str).split(/\s+/); let lines=[],line='';
    for(const word of words){
      const test=line?`${line} ${word}`:word;
      if(ctx.measureText(test).width>maxWidth && line){lines.push(line);line=word;} else line=test;
    }
    if(line) lines.push(line); lines=lines.slice(0,maxLines);
    const total=(lines.length-1)*lineHeight;
    lines.forEach((ln,i)=>ctx.fillText(ln,x,y-total/2+i*lineHeight));
    ctx.restore();
  }


  function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
  function mergeLayout(base,incoming){
    const out=clone(base);
    if(incoming && typeof incoming==='object'){
      Object.keys(out).forEach(k=>{ if(incoming[k]) out[k]={...out[k],...incoming[k]}; });
    }
    return out;
  }
  function loadSavedLayout(){
    try{ const raw=localStorage.getItem(LAYOUT_KEY); if(raw) layout=mergeLayout(defaultLayout,JSON.parse(raw)); }catch(e){}
  }
  function saveLayout(){ localStorage.setItem(LAYOUT_KEY,JSON.stringify(layout)); }

  function fontString(b,size){
    const style=b.italic?'italic ':'';
    const weight=b.bold?'700':'400';
    return `${style}${weight} ${size}px ${b.family||'Arial'}`;
  }
  function displayContent(key,generated){
    const b=layout[key];
    return b && b.override===true ? (b.content ?? '') : String(generated ?? '');
  }
  function fitStyled(key,generated){
    const b=layout[key]; if(!b)return;
    const value=displayContent(key,generated);
    let size=b.font||20;
    while(size>(b.min||8)){
      ctx.font=fontString(b,size);
      if(ctx.measureText(value).width<=b.w)break;
      size-=1;
    }
    ctx.save();
    ctx.fillStyle=b.color||'#111';
    ctx.font=fontString(b,size);
    ctx.textBaseline='middle';
    ctx.textAlign=b.align||'left';
    let x=b.x;
    if(b.align==='center')x=b.x+b.w/2;
    if(b.align==='right')x=b.x+b.w;
    ctx.fillText(value,x,b.y+b.h/2);
    ctx.restore();
  }

  function drawStatStack(key, generated){
    const b=layout[key]; if(!b)return;
    const raw=displayContent(key,generated);
    let lines=String(raw).split('\n');
    if(lines.length < 2){
      const m=String(raw).match(/^(\S+)\s+(\(.+\))$/);
      lines = m ? [m[1], m[2]] : [String(raw), ''];
    }
    const line1=lines[0] ?? '';
    const line2=lines[1] ?? '';

    let size1=b.font||32;
    while(size1>(b.min||8)){
      ctx.font=fontString(b,size1);
      if(ctx.measureText(line1).width<=b.w)break;
      size1-=1;
    }
    let size2=Math.max(Math.round(size1*0.62), (b.min||8));
    while(size2>(b.min||8)){
      ctx.font=fontString(b,size2);
      if(ctx.measureText(line2).width<=b.w)break;
      size2-=1;
    }

    ctx.save();
    ctx.fillStyle=b.color||'#111';
    ctx.textAlign=b.align||'center';
    ctx.textBaseline='middle';
    let x=b.x+b.w/2;
    if(b.align==='left')x=b.x;
    if(b.align==='right')x=b.x+b.w;

    const gap=Math.max(6, Math.round(size1*0.12));
    const y1=b.y + b.h*0.34;
    const y2=b.y + b.h*0.72 + gap*0.05;

    ctx.font=fontString(b,size1);
    ctx.fillText(line1,x,y1);
    if(line2){
      ctx.font=fontString({...b, bold:false},size2);
      ctx.fillText(line2,x,y2);
    }
    ctx.restore();
  }
  function wrappedStyled(key,generated,maxLines=2){
    const b=layout[key]; if(!b)return;
    const value=displayContent(key,generated);
    let size=b.font||15, lines=[];
    while(size>=(b.min||8)){
      ctx.font=fontString(b,size);
      const words=value.split(/\s+/).filter(Boolean);
      lines=[]; let line='';
      for(const word of words){
        const test=line?`${line} ${word}`:word;
        if(line && ctx.measureText(test).width>b.w){lines.push(line);line=word;}else line=test;
      }
      if(line)lines.push(line);
      if(lines.length<=maxLines)break;
      size-=1;
    }
    lines=lines.slice(0,maxLines);
    const lh=Math.round(size*1.12);
    const total=(lines.length-1)*lh;
    ctx.save();
    ctx.fillStyle=b.color||'#111';
    ctx.font=fontString(b,size);
    ctx.textBaseline='middle';
    ctx.textAlign=b.align||'center';
    let x=b.x+b.w/2;
    if(b.align==='left')x=b.x;
    if(b.align==='right')x=b.x+b.w;
    lines.forEach((ln,i)=>ctx.fillText(ln,x,b.y+b.h/2-total/2+i*lh));
    ctx.restore();
  }
  function listStyled(key,generatedItems){
    const b=layout[key]; if(!b)return;
    const raw=displayContent(key,(generatedItems||[]).join('\n'));
    const items=raw.split('\n').map(s=>s.trim()).filter(Boolean);
    const lh=b.lineHeight||Math.round((b.font||20)*1.3);
    let y=b.y;
    for(const item of items){
      if(y+lh>b.y+b.h)break;
      const temp={...b,y:y,w:b.w,h:lh};
      const old=layout[key]; layout[key]=temp;
      temp.override=true; temp.content=item;
      fitStyled(key,item);
      layout[key]=old;
      y+=lh;
    }
  }

  function drawEquipmentFancy(items){
    const b=layout['equipment']; if(!b)return;
    const raw=displayContent('equipment',(items||[]).join('\n'));
    const entries=raw.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,4);
    if(!entries.length)return;

    const slotH=b.h/4;
    const cx=b.x+b.w/2;

    function wrap(text,maxWidth,size,maxLines){
      ctx.font=fontString({...b,bold:true},size);
      const words=String(text).split(/\s+/).filter(Boolean);
      const lines=[];let line='';
      for(const word of words){
        const test=line?`${line} ${word}`:word;
        if(line && ctx.measureText(test).width>maxWidth){
          lines.push(line);line=word;
        }else line=test;
      }
      if(line)lines.push(line);
      return lines.slice(0,maxLines);
    }

    entries.forEach((entry,index)=>{
      const top=b.y+index*slotH+2;
      const parts=entry.split('—');
      const name=(parts.shift()||'').trim();
      const desc=(parts.join('—')||'').trim();

      // Gold deliberately has no description.
      if(/^\d+\s*gp$/i.test(name) && !desc){
        let goldSize=24;
        ctx.save();
        ctx.fillStyle=b.color||'#111';
        ctx.textAlign='center';
        ctx.textBaseline='top';
        ctx.font=fontString({...b,bold:true},goldSize);
        ctx.fillText(name,cx,top+9);
        ctx.restore();
        return;
      }

      // Larger equipment typography than the previous version.
      let nameSize=22;
      while(nameSize>16){
        ctx.font=fontString({...b,bold:true},nameSize);
        if(ctx.measureText(name).width<=b.w-20)break;
        nameSize--;
      }

      let descSize=15;
      let descLines=wrap(desc,b.w-28,descSize,2);
      while(descSize>12){
        ctx.font=fontString({...b,bold:true},descSize);
        const lines=wrap(desc,b.w-28,descSize,2);
        if(lines.length<=2){descLines=lines;break;}
        descSize--;
      }

      ctx.save();
      ctx.fillStyle=b.color||'#111';
      ctx.textAlign='center';
      ctx.textBaseline='top';

      ctx.font=fontString({...b,bold:true},nameSize);
      ctx.fillText(name,cx,top);

      ctx.font=fontString({...b,bold:true},descSize);
      const descTop=top+nameSize+5;
      const lh=Math.round(descSize*1.12);
      descLines.forEach((line,i)=>ctx.fillText(line,cx,descTop+i*lh));
      ctx.restore();
    });
  }

  function generatedValueForKey(key){
    if(!state)return '';
    if(key==='name')return state.name;
    if(key==='species')return state.species;
    if(key==='class')return state.cls;
    if(key==='level')return state.level;
    if(key==='ac')return state.ac;
    if(key==='hp')return playMode ? `${state.currentHp ?? state.hp} / ${state.hp}` : state.hp;
    if(key==='speed')return state.speed;
    if(key==='initiative')return fmtMod(modifier(state.stats.DEX));
    if(key==='passive')return 10+modifier(state.stats.WIS)+(state.skillProfs.includes('Perception')?state.prof:0);
    if(key==='equipment')return state.equipment.join('\n');
    if(key.startsWith('stat_')){
      const a=key.slice(5); return `${state.stats[a]}\n(${fmtMod(modifier(state.stats[a]))})`;
    }
    if(key.startsWith('save_')){
      const a=key.slice(5);
      const v=modifier(state.stats[a])+(state.saveProfs.includes(a)?state.prof:0);
      return fmtMod(v);
    }
    if(key.startsWith('skill_')){
      const name=key.slice(6);
      const pair=SKILLS.find(s=>s[0]===name); if(!pair)return '';
      const v=modifier(state.stats[pair[1]])+(state.skillProfs.includes(name)?state.prof:0);
      return fmtMod(v);
    }
    const m=key.match(/^action(\d+)_(name|desc|bonus|damage)$/);
    if(m){
      const atk=(state.actions||[])[Number(m[1])-1]; if(!atk)return '';
      if(m[2]==='name')return atk.name;
      if(m[2]==='desc')return atk.desc;
      if(m[2]==='bonus')return fmtMod(attackBonus(atk));
      if(m[2]==='damage')return attackDamage(atk);
    }
    return '';
  }

  function updateSelectedEditor(){
    const active=!!selectedBoxKey;
    els.selectedEditor.classList.toggle('editor-disabled',!active);
    if(!active){
      els.layoutStatus.textContent=layoutMode?'Layout mode on. Click a text box to edit it.':'Layout mode off.';
      return;
    }
    const b=layout[selectedBoxKey];
    els.selectedKey.value=selectedBoxKey;
    els.boxX.value=Math.round(b.x); els.boxY.value=Math.round(b.y);
    els.boxW.value=Math.round(b.w); els.boxH.value=Math.round(b.h);
    els.fontSizeControl.value=b.font||20;
    els.fontFamilyControl.value=b.family||'Arial';
    els.alignControl.value=b.align||'left';
    els.colorControl.value=b.color||'#111111';
    els.boldControl.checked=!!b.bold; els.italicControl.checked=!!b.italic;
    els.selectedContent.value=b.override===true?(b.content??''):generatedValueForKey(selectedBoxKey);
    els.layoutStatus.textContent=`Selected: ${selectedBoxKey}\nX ${Math.round(b.x)}  Y ${Math.round(b.y)}  W ${Math.round(b.w)}  H ${Math.round(b.h)}\nFont ${b.font||20}px`;
  }

  function renderLayoutOverlay(){
    if(!layoutOverlay)return;
    layoutOverlay.innerHTML='';
    const scale=sheetWrap.clientWidth/W;
    Object.entries(layout).forEach(([key,b])=>{
      const box=document.createElement('div');
      box.className='layout-box'+(selectedBoxKey===key?' active':'');
      box.dataset.key=key;
      box.style.left=(b.x*scale)+'px'; box.style.top=(b.y*scale)+'px';
      box.style.width=(b.w*scale)+'px'; box.style.height=(b.h*scale)+'px';
      const label=document.createElement('div');label.className='box-label';label.textContent=key;box.appendChild(label);
      const handle=document.createElement('div');handle.className='resize-handle';box.appendChild(handle);
      layoutOverlay.appendChild(box);
    });
    updateSelectedEditor();
  }
  function setLayoutMode(on){
    layoutMode=!!on;
    document.body.classList.toggle('layout-edit',layoutMode);
    els.toggleLayoutBtn.textContent=layoutMode?'Exit Layout Edit':'Edit Layout';
  }
  function pointerCanvas(e){
    const r=layoutOverlay.getBoundingClientRect();
    return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
  }
  function beginDrag(e){
    if(!layoutMode)return;
    const box=e.target.closest('.layout-box'); if(!box)return;
    selectedBoxKey=box.dataset.key;
    const p=pointerCanvas(e),b=layout[selectedBoxKey];
    dragState={key:selectedBoxKey,resize:e.target.classList.contains('resize-handle'),sx:p.x,sy:p.y,b:{...b}};
    renderLayoutOverlay(); e.preventDefault();
  }
  function moveDrag(e){
    if(!dragState)return;
    const p=pointerCanvas(e),dx=p.x-dragState.sx,dy=p.y-dragState.sy,b=layout[dragState.key];
    if(dragState.resize){b.w=Math.max(12,dragState.b.w+dx);b.h=Math.max(12,dragState.b.h+dy);}
    else{b.x=dragState.b.x+dx;b.y=dragState.b.y+dy;}
    render();
  }
  function endDrag(){dragState=null;}

  function drawCheck(cx,cy,scale=1){
    ctx.save();ctx.strokeStyle='#111';ctx.lineWidth=5*scale;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(cx-10*scale,cy);ctx.lineTo(cx-2*scale,cy+10*scale);ctx.lineTo(cx+16*scale,cy-15*scale);ctx.stroke();ctx.restore();
  }

  function attackBonus(atk){
    const ab=classData[state.cls]?.spell && atk.ability===classData[state.cls].spell ? classData[state.cls].spell : atk.ability;
    return modifier(state.stats[ab]||10)+state.prof;
  }
  function attackDamage(atk){
    if(atk.type==='Bonus') return atk.dice;
    const mod=modifier(state.stats[atk.ability]||10);
    const suffix = mod===0?'':(mod>0?`+${mod}`:`${mod}`);
    return `${atk.dice}${suffix} ${atk.type}`;
  }

  function render(){
    if(!state || readyCount<3)return;
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
    ctx.drawImage(baseImg,0,0,W,H);
    if(portraitImg){
      ctx.save();
      ctx.beginPath();
      ctx.rect(505,22,909,925);
      ctx.clip();
      drawCoverImage(portraitImg,505,22,909,925);
      ctx.restore();
    }
    ctx.drawImage(overlayImg,0,0,W,H);

    ['name','species','class','level','ac','hp','speed'].forEach(k=>fitStyled(k,generatedValueForKey(k)));
    ABILS.forEach(a=>drawStatStack(`stat_${a}`,generatedValueForKey(`stat_${a}`)));
    fitStyled('initiative',generatedValueForKey('initiative'));
    fitStyled('passive',generatedValueForKey('passive'));

    const saveY=[1167,1224,1281,1338,1395,1452];
    ABILS.forEach((a,i)=>{
      if(state.saveProfs.includes(a))drawCheck(103,saveY[i]-2,1.05);
      fitStyled(`save_${a}`,generatedValueForKey(`save_${a}`));
    });

    const skillYs=[1604.5,1641.0,1679.2,1716.5,1753.6,1790.5,1828.1,1863.9,1899.8];
    SKILLS.forEach(([name],idx)=>{
      const right=idx>=9,row=right?idx-9:idx;
      const tickX=right?357:65;
      if(state.skillProfs.includes(name))drawCheck(tickX,skillYs[row]-1,.65);
      fitStyled(`skill_${name}`,generatedValueForKey(`skill_${name}`));
    });

    for(let i=1;i<=4;i++){
      fitStyled(`action${i}_name`,generatedValueForKey(`action${i}_name`));
      wrappedStyled(`action${i}_desc`,generatedValueForKey(`action${i}_desc`),2);
      fitStyled(`action${i}_bonus`,generatedValueForKey(`action${i}_bonus`));
      fitStyled(`action${i}_damage`,generatedValueForKey(`action${i}_damage`));
    }
    drawEquipmentFancy(state.equipment);

    els.summary.textContent=`${state.name} • Level ${state.level} ${state.species} ${state.cls} • AC ${state.ac} • HP ${state.hp} • proficiency ${fmtMod(state.prof)}`;
  }


  function setEditCharacterExpanded(expanded){
    const panel=els.editCharacterPanel;
    const toggle=els.editCharacterToggle;
    if(!panel || !toggle)return;
    panel.classList.toggle('collapsed',!expanded);
    toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
  }

  els.editCharacterToggle.addEventListener('click',()=>{
    const expanded=els.editCharacterToggle.getAttribute('aria-expanded')==='true';
    setEditCharacterExpanded(!expanded);
  });

  // Load collapsed every time.
  setEditCharacterExpanded(false);

  function enterPlayMode(){
    if(!state)return;
    playMode=true;
    if(state.currentHp == null || state.currentHp > state.hp) state.currentHp=state.hp;
    document.body.classList.add('play-mode');
    render();
    try{
      const el=document.documentElement;
      if(!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    }catch(e){}
  }

  function exitPlayMode(){
    playMode=false;
    document.body.classList.remove('play-mode');
    render();
    try{
      if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    }catch(e){}
  }

  function changeHp(delta){
    if(!state)return;
    const max=Math.max(0,Number(state.hp)||0);
    const current=state.currentHp==null?max:Number(state.currentHp);
    state.currentHp=Math.max(0,Math.min(max,current+delta));
    render();
  }

  els.playBtn.addEventListener('click',enterPlayMode);
  els.exitPlayBtn.addEventListener('click',exitPlayMode);
  els.hpMinusBtn.addEventListener('click',()=>changeHp(-1));
  els.hpPlusBtn.addEventListener('click',()=>changeHp(1));
  window.addEventListener('keydown',e=>{if(e.key==='Escape' && playMode)exitPlayMode();});

  els.generateBtn.addEventListener('click',generateCharacter);
  els.downloadBtn.addEventListener('click',()=>{
    render();const a=document.createElement('a');
    const safe=(state?.name||'character').replace(/[^a-z0-9]+/gi,'_').replace(/^_|_$/g,'');
    a.download=`${safe}_600_second_dnd.png`;a.href=canvas.toDataURL('image/png');a.click();
  });
  els.fitBtn.addEventListener('click',()=>{document.getElementById('sheetStage').scrollTo({top:0,left:0,behavior:'smooth'});});
})();
</script>
